<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짝꿍말 번역기</title>
<style>
  :root { --bg: #fff8ee; --card: #ffffff; --ink: #2d2a32; --soft: #7a7385; --main: #ff7a59; --line: #eee3d3; --bad: #e0464e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1b22; --card: #2a2731; --ink: #f2eef7; --soft: #a59fb0; --line: #3a3642; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 2px solid var(--line);
    border-radius: 18px; padding: 24px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; }
  p { color: var(--soft); margin: 0 0 18px; }
  input, button { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px; border-radius: 12px; }
  input { border: 2px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 10px; }
  button { border: none; background: var(--main); color: #fff; font-weight: bold; cursor: pointer; }
  #msg { color: var(--bad); font-weight: bold; min-height: 1.5em; margin-top: 10px; }
</style>
</head>
<body>
<form id="lock">
  <h1>🔒 짝꿍말 번역기</h1>
  <p>비밀번호를 아는 짝꿍만 들어올 수 있어요</p>
  <input id="pw" type="password" placeholder="비밀번호" autofocus>
  <button id="go">열기 🔓</button>
  <div id="msg"></div>
</form>
<script>
const SALT = '__SALT__', IV = '__IV__', ITER = __ITER__, DATA = '__DATA__';
const SESSION_KEY = 'jjakkung-pw';
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function unlock(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
  return new TextDecoder().decode(plain);
}

async function tryOpen(password, fromSession) {
  const msg = document.getElementById('msg');
  // 자물쇠(https) 없는 주소에서는 인터넷 창이 암호 풀기 도구를 꺼 버려요
  if (!window.crypto || !crypto.subtle) {
    msg.textContent = '🔒 자물쇠(https) 주소에서만 열려요. 주소가 https:// 로 시작하는지 확인해 주세요!';
    return;
  }
  msg.textContent = '열고 있어요... ⏳';
  try {
    const html = await unlock(password);
    try { sessionStorage.setItem(SESSION_KEY, password); } catch {}
    document.open(); document.write(html); document.close();
  } catch {
    try { sessionStorage.removeItem(SESSION_KEY); } catch {}
    msg.textContent = fromSession ? '' : '땡! 비밀번호가 달라요 🙅';
  }
}

document.getElementById('lock').onsubmit = e => {
  e.preventDefault();
  tryOpen(document.getElementById('pw').value, false);
};

// 이 창을 닫기 전까지는 다시 묻지 않아요
let saved = null;
try { saved = sessionStorage.getItem(SESSION_KEY); } catch {}
if (saved) tryOpen(saved, true);
</script>
</body>
</html>
