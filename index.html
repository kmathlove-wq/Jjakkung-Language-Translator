  msg.textContent = '열고 있어요... ⏳';
  try {
    const html = await unlock(password);
    try { sessionStorage.setItem(SESSION_KEY, password); } catch {}
    document.open(); document.write(html); document.close();
  } catch {
    try { sessionStorage.removeItem(SESSION_KEY); } catch {}
    msg.textContent = fromSession ? '' : '땡! 비밀번호가 달라요 🙅';
  }
}

document.getElementById('lock').onsubmit = e => {
  e.preventDefault();
  tryOpen(document.getElementById('pw').value, false);
};

// 이 창을 닫기 전까지는 다시 묻지 않아요
let saved = null;
try { saved = sessionStorage.getItem(SESSION_KEY); } catch {}
if (saved) tryOpen(saved, true);
</script>
